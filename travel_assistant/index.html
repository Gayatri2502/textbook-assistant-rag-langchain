<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel assistant</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;color:#173047}main{background:#f1f7f7;padding:1.5rem;border-radius:1rem}input,button{font:inherit;padding:.7rem}input{width:min(70%,32rem)}button{background:#146b67;color:white;border:0;border-radius:.3rem}article{white-space:pre-wrap;margin:1rem 0;padding:1rem;background:white;border-radius:.5rem}small{color:#435b66}</style></head><body><h1>Travel assistant</h1><p>Ask about your indexed travel documents, or check current modelled weather.</p><main><div id="chat" aria-live="polite"></div><form id="form"><label for="question">Your question</label><br><input id="question" required maxlength="4000"><button>Ask</button></form><p><small>Answers depend on your documents. Verify changing travel requirements with official sources.</small></p></main><h2>Weather</h2><form id="weather"><label for="location">City or location</label><br><input id="location" required minlength="2" maxlength="100"><button>Check weather</button></form><article id="weather-result" aria-live="polite"></article><script>
const history=[]; const chat=document.querySelector('#chat');
function line(text){const el=document.createElement('article');el.textContent=text;chat.append(el)}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const input=document.querySelector('#question');const question=input.value;input.value='';line('You: '+question);const button=e.submitter;button.disabled=true;try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,history:history.slice(-20)})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');line('Assistant: '+data.answer+'\n\nSources: '+data.sources.map(s=>'['+s.id+'] '+s.source).join(', '));history.push({role:'user',content:question},{role:'assistant',content:data.answer})}catch(err){line('Error: '+err.message)}finally{button.disabled=false}});
document.querySelector('#weather').addEventListener('submit',async e=>{e.preventDefault();const out=document.querySelector('#weather-result');out.textContent='Loading…';try{const r=await fetch('/weather?location='+encodeURIComponent(document.querySelector('#location').value));const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');out.textContent=d.location+' — '+d.current.temperature_2m+' '+d.units.temperature_2m+'\nAs of '+d.current.time+' ('+d.timezone+')\n'+d.description+'; source: '+d.source}catch(err){out.textContent='Error: '+err.message}});
</script></body></html>
